services:
  - type: web
    name: little-lemon
    runtime: python
    plan: free
    rootDir: littlelemon
    buildCommand: "./build.sh"
    startCommand: "gunicorn littlelemon.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false   # set after first deploy: little-lemon.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false   # paste in Render dashboard
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false   # paste in Render dashboard
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: noreply@little-lemon.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: ""
