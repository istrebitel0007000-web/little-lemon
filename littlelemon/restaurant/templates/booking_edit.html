{% extends "base.html" %}
{% block title %}Edit Booking — Little Lemon{% endblock %}
{% block content %}
<section style="max-width:580px;margin:40px auto;padding:0 20px;">
  <h1 style="font-family:'Markazi Text',serif;color:#3d5a4f;">Edit Booking</h1>

  <div style="background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:32px;margin-top:20px;">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div style="margin-bottom:18px;">
          <label style="display:block;font-weight:600;color:#333;margin-bottom:6px;">
            {{ field.label }}
          </label>
          {{ field }}
          {% if field.errors %}
            {% for error in field.errors %}
              <div style="color:#e74c3c;font-size:.85rem;margin-top:4px;">{{ error }}</div>
            {% endfor %}
          {% endif %}
        </div>
      {% endfor %}
      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit"
          style="padding:12px 28px;background:#f4ce14;color:#333;border:none;
                 border-radius:8px;font-weight:700;cursor:pointer;font-size:1rem;">
          Save Changes
        </button>
        <a href="{% url 'my_bookings' %}"
           style="padding:12px 28px;border:1px solid #333;border-radius:8px;
                  text-decoration:none;color:#333;font-size:1rem;">
          Cancel
        </a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
