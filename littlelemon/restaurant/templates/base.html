{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %}Little Lemon{% endblock %}</title>
    <meta name="description" content="Little Lemon — book a table and explore our menu of Malay, Chinese, Thai and Western dishes." />
    <meta name="author" content="Little Lemon" />

    <!-- PWA -->
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Little Lemon" />
    <link rel="apple-touch-icon" href="{% static 'img/icon-192.png' %}" />

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.ico' %}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Markazi+Text:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Main CSS — loaded normally (not preload) so dark theme applies immediately -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <!-- Header & Nav -->
    {% include 'partials/_header.html' %}

    <!-- Django messages -->
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="msg msg-{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <!-- Page content -->
    <main>{% block content %}{% endblock %}</main>

    <!-- Footer -->
    {% include 'partials/_footer.html' %}

    <!-- PWA service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
