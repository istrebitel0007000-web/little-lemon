{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Nasi Kandar</title>
    <meta name="description" content="A brief description" />
    <meta
      name="author"
      content="Based in KualaLumpur, Malaysia, Nasi Kandar is a family owned Malay, Chinese, Thai restaurant, focused on traditional recipes served with a modern twist."
    />

    <!-- Load favicon -->
    <link
      rel="shortcut icon"
      type="image/png"
      href="{% static 'img/favicon.ico' %}"
    />

    <!-- Include your CSS files here -->
    <link
      rel="preload"
      as="style"
      href="{% static 'css/style.css' %}"
      onload="this.rel = 'stylesheet'"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla&family=Markazi+Text:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!--Header content-->
    {% include 'partials/_header.html' %}

    {% if messages %}
      <ul class="messages" style="list-style:none; padding:12px 24px; margin:0;">
        {% for message in messages %}
          <li class="msg msg-{{ message.tags }}"
              style="background:#e8f5e9; color:#2e7d32; padding:10px 16px; border-radius:6px; margin:8px 0;">
            {{ message }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}

    <main>{% block content %} {% endblock %}</main>

    <!--Footer content-->
    {% include 'partials/_footer.html' %}
  </body>
</html>
